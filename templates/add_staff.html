<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff - Thika Gymkhana</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 font-sans text-gray-800">
    <header class="bg-emerald-800 px-4 py-4 text-white">
        <div class="mx-auto flex max-w-3xl flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold">Add Employee</h1>
                <p class="text-xs text-emerald-200">Create an employee record for HR attendance</p>
            </div>
            <a class="rounded bg-emerald-700 px-3 py-2 text-xs hover:bg-emerald-600" href="{{ url_for('daily_attendance') }}">Back to Attendance</a>
        </div>
    </header>

    <main class="mx-auto max-w-3xl space-y-4 px-4 py-6">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="rounded p-3 text-sm {{ 'bg-red-100 text-red-800' if category == 'error' else 'bg-emerald-100 text-emerald-800' }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post" class="space-y-4 rounded bg-white p-6 shadow-sm">
            <label class="block text-sm font-medium">
                Employee name
                <input class="mt-1 block w-full rounded border border-gray-300 p-2" type="text" name="name" value="{{ name }}" maxlength="120" required autofocus>
            </label>
            <label class="block text-sm font-medium">
                Department
                <input class="mt-1 block w-full rounded border border-gray-300 p-2" type="text" name="department" value="{{ department }}" maxlength="120" required>
            </label>
            <p class="text-xs text-gray-500">The system assigns a unique staff ID automatically.</p>
            <button class="rounded bg-emerald-700 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800" type="submit">Add Employee</button>
        </form>
    </main>
</body>
</html>
